name: Update node-agent CLI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: update CLI
        run: |
          docker pull --platform linux/amd64 "${{ secrets.IMAGE }}"
          id=$(docker create "${{ secrets.IMAGE }}")
          docker export "$id" | tar -x -C /tmp usr/local/bin/cli
          mv /tmp/usr/local/bin/cli ./cli
          docker rm "$id"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Update CLI $(date -u +%F)"
          git push
